<main>
<section>
  <div class="container center">
    <h1>Careers@TheCloudReference</h1>
    <p class="lead">Join Our Energetic Team</p>
  </div>
  <div class="container">
    <form class="form-card" data-web3forms>
      <input type="hidden" name="subject" value="New job application from thecloudreference.com">
      <input type="hidden" name="from_name" value="TheCloudReference careers">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
      <label for="position">Position</label>
      <select id="position" name="position" style="width:100%;font:inherit;padding:12px 14px;border:1px solid #c6cbd1;border-radius:8px;background:#fff">
        <option value="Open application">Open application</option>
        <option value="BizTalk Consultant" data-slug="biztalk-consultant">BizTalk Consultant</option>
        <option value="OT/ICS Security Consultant" data-slug="ot-ics-security-consultant">OT/ICS Security Consultant</option>
        <option value="React Native Developer" data-slug="react-native-developer">React Native Developer</option>
        <option value="Cloud Developer" data-slug="cloud-developer">Cloud Developer</option>
        <option value=".NET Fullstack Developer" data-slug="net-fullstack-developer">.NET Fullstack Developer</option>
        <option value="C/C++ Software Engineer" data-slug="c-c-software-engineer">C/C++ Software Engineer</option>
        <option value="Python Developer" data-slug="python-developer">Python Developer</option>
      </select>
      <label for="first">Name</label>
      <input id="first" name="first_name" type="text" placeholder="Jane" required autocomplete="given-name">
      <label for="last">Last Name</label>
      <input id="last" name="last_name" type="text" placeholder="Doe" required autocomplete="family-name">
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="cv">Link to your CV or LinkedIn profile</label>
      <input id="cv" name="cv_link" type="url" placeholder="https://www.linkedin.com/in/..." required>
      <label for="message">Message (Optional)</label>
      <textarea id="message" name="message"></textarea>
      <button class="btn btn--primary" type="submit">Submit</button>
      <p class="form-status" role="status"></p>
    </form>
  </div>
</section>
<script>
  // Preselect the position when coming from a job post (/apply/?position=slug)
  const slug = new URLSearchParams(location.search).get("position");
  const opt = slug && document.querySelector(`#position option[data-slug="${slug}"]`);
  if (opt) opt.selected = true;
</script>
</main>
